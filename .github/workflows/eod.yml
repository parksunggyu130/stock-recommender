name: 16:00 KST EOD check

on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC == 16:00 KST(같은 날). 주말 스킵은 앱 내부(_is_weekend)에서 처리.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Restore data.db from data branch
        run: |
          if [ -f data-branch/data.db ]; then
            cp data-branch/data.db backend/data.db
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run EOD job
        working-directory: backend
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_INPROCESS_SCHEDULER: "false"
        run: python -m app.scripts.run_eod

      - name: Persist data.db back to data branch
        run: |
          cp backend/data.db data-branch/data.db
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.db
          git diff --cached --quiet && echo "no changes" || git commit -m "Update data.db after eod run [skip ci]"
          git push origin HEAD:data
